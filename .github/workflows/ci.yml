name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# A new push supersedes an in-flight run for the same ref: no point spending
# runner minutes validating a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis. Separate from tests so a formatting failure does not
  # obscure a genuine test failure, and because it needs no services.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Typechecking cannot resolve @prisma/client until this runs.
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Tests. Runs against real Postgres and real Redis service containers —
  # the concurrency guarantees under test are properties of those systems, so
  # substituting an in-memory fake would validate nothing.
  # ---------------------------------------------------------------------------
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinzo
          POSTGRES_PASSWORD: clinzo
          POSTGRES_DB: clinzo
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinzo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://clinzo:clinzo@localhost:5432/clinzo?schema=public
      TEST_DATABASE_URL: postgresql://clinzo:clinzo@localhost:5432/clinzo_test?schema=public&connection_limit=30&pool_timeout=20
      TEST_REDIS_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-of-more-than-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-of-more-than-thirty-two-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        # `migrate deploy` is what production runs. Using `db push` here would
        # skip the hand-written constraint layer that the concurrency tests
        # exist to verify.
        run: npx prisma migrate deploy

      - name: Verify integrity constraints were applied
        # Cheap guard against a migration that silently lost the anti-double-
        # booking index — the one failure the test suite could not detect if
        # the index simply never existed to begin with.
        run: |
          PGPASSWORD=clinzo psql -h localhost -U clinzo -d clinzo -tAc \
            "SELECT count(*) FROM pg_indexes WHERE indexname = 'bookings_one_confirmed_per_slot'" \
            | grep -q '^1$' || { echo "::error::anti-double-booking index is missing"; exit 1; }

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (includes the 100-way concurrency proof)
        run: npm run test:integration

      - name: Coverage
        run: npm run test:coverage -- --selectProjects unit
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build. Proves the production image actually builds and boots, which a
  # `tsc` run alone does not.
  # ---------------------------------------------------------------------------
  build:
    name: Build application and Docker image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Compile
        run: npm run build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clinzo-scheduling:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke-test the image
        # Confirms the entrypoint runs and the compiled output is present.
        # A full boot needs Postgres and Redis, which the test job covers.
        run: |
          docker run --rm --entrypoint node clinzo-scheduling:${{ github.sha }} \
            -e "require('fs').accessSync('/app/dist/server.js'); console.log('image layout ok')"

  # ---------------------------------------------------------------------------
  # Dependency audit. Advisory: a new advisory against a transitive dependency
  # should raise a flag, not block an unrelated hotfix.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
